<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Pedidos ML</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --border:#2a2e37;
    --text:#e8e9ec; --muted:#8a8f9a; --accent:#4f7cff;
    --ok:#2ecc71; --warn:#f5a623; --bad:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:24px;}
  h1{font-size:20px; margin-bottom:4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .toolbar{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  button{background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer;}
  button.secondary{background:var(--card); border:1px solid var(--border); color:var(--text);}
  .pedido{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;}
  .pedido input[type=checkbox]{width:20px; height:20px; accent-color:var(--ok); flex-shrink:0;}
  .info{flex:1; min-width:0;}
  .titulo{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{font-size:11px; padding:3px 8px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .badge.delivered{background:rgba(46,204,113,.15); color:var(--ok);}
  .badge.shipped{background:rgba(245,166,35,.15); color:var(--warn);}
  .badge.pending{background:rgba(138,143,154,.15); color:var(--muted);}
  .badge.other{background:rgba(231,76,60,.15); color:var(--bad);}
  #estado{font-size:13px; color:var(--muted); margin-bottom:16px;}
</style>
</head>
<body>
  <h1>Mis Pedidos — Mercado Libre</h1>
  <p class="sub">Conectado a tu cuenta. Se actualiza solo, o apretá "Actualizar" para forzar.</p>

  <div class="toolbar">
    <button id="btnConectar">Conectar cuenta de ML</button>
    <button id="btnSync" class="secondary">Actualizar ahora</button>
  </div>
  <div id="estado"></div>
  <div id="lista"></div>

<script>
  // Reemplazar con tus datos reales del proyecto Supabase de este sistema
  const SUPABASE_URL = 'TU_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const estadoEl = document.getElementById('estado');
  const listaEl = document.getElementById('lista');

  document.getElementById('btnConectar').onclick = () => window.location.href = '/api/login';

  document.getElementById('btnSync').onclick = async () => {
    estadoEl.textContent = 'Sincronizando con Mercado Libre...';
    const resp = await fetch('/api/sync');
    const data = await resp.json();
    if (resp.ok) {
      estadoEl.textContent = `Listo — ${data.guardados} pedidos actualizados.`;
      cargarPedidos();
    } else {
      estadoEl.textContent = 'Error: ' + (data.error || 'desconocido');
    }
  };

  function badgeClass(status) {
    if (status === 'delivered') return 'delivered';
    if (status === 'shipped' || status === 'ready_to_ship' || status === 'handling') return 'shipped';
    if (!status) return 'pending';
    return 'other';
  }

  function badgeLabel(status) {
    const map = {
      delivered: 'Entregado', shipped: 'En camino', ready_to_ship: 'Listo para enviar',
      handling: 'Preparando', pending: 'Pendiente', not_delivered: 'No entregado',
      cancelled: 'Cancelado',
    };
    return map[status] || (status || 'Sin envío');
  }

  async function cargarPedidos() {
    const { data, error } = await supabase
      .from('pedidos')
      .select('*')
      .order('fecha_creacion', { ascending: false });

    if (error) { estadoEl.textContent = 'Error cargando pedidos: ' + error.message; return; }

    listaEl.innerHTML = '';
    for (const p of data) {
      const div = document.createElement('div');
      div.className = 'pedido';
      div.innerHTML = `
        <input type="checkbox" ${p.verificado_por_mi ? 'checked' : ''} data-id="${p.order_id}" />
        <div class="info">
          <div class="titulo">${p.titulo || 'Pedido #' + p.order_id}</div>
          <div class="meta">${p.vendedor_nickname || ''} · $${p.total} ${p.moneda} · ${new Date(p.fecha_creacion).toLocaleDateString('es-AR')}</div>
        </div>
        <span class="badge ${badgeClass(p.status_envio)}">${badgeLabel(p.status_envio)}</span>
      `;
      div.querySelector('input').onchange = async (e) => {
        await supabase.from('pedidos').update({ verificado_por_mi: e.target.checked }).eq('order_id', p.order_id);
      };
      listaEl.appendChild(div);
    }
  }

  cargarPedidos();
</script>
</body>
</html>
